name: PR actions
# cSpell:ignore esac htmltest refcache nvmrc opentelemetrybot

on:
  issue_comment:
    types: [created]

env:
  COMMENT: ${{ github.event.comment.body }}
  PR_NUM: ${{ github.event.issue.number }}
  USER_EMAIL: 107717825+opentelemetrybot@users.noreply.github.com
  USER_NAME: opentelemetrybot

jobs:
  pr-action:
    name: Run PR action
    runs-on: ubuntu-latest
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/fix:')
    permissions:
      contents: write
      pull-requests: write

    env:
      DEPTH: --depth 999 # submodule clone depth

    steps:
      - name: Context info
        run: |
          echo $PR_NUM
          echo $COMMENT

      - uses: actions/checkout@v4

      - name: Extract action name
        id: extract_action_name
        run: |
          PR_ACTION=$(echo $COMMENT | grep -oP '/fix:\K[:-_0-9a-z]+')
          echo "Action is $PR_ACTION"
          ACTION_NAMES="all|dict|expired|filenames|format|htmltest-config|i18n|markdown|refcache(:refresh)?|submodules?|text"
          if [[ ! "$PR_ACTION" =~ ^($ACTION_NAMES)$ ]]; then
            echo "Invalid action name: $PR_ACTION"
            echo "Action name should be one of: $ACTION_NAMES"
            exit 1
          fi
          echo "PR_ACTION=$PR_ACTION" >> "$GITHUB_ENV"

      - name: Write start comment
        run: |
          gh pr comment $PR_NUM -b "You triggered fix:${PR_ACTION} action run at $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ secrets.OPENTELEMETRYBOT_GITHUB_TOKEN }}

      - run: gh pr checkout $PR_NUM -b "pr-action-${RANDOM}"
        env:
          GH_TOKEN: ${{ secrets.OPENTELEMETRYBOT_GITHUB_TOKEN }}

      - name: Create NPM cache-hash input file
        run: |
          mkdir -p tmp
          jq '{devDependencies, dependencies, engines, gitHubActionCacheKey}' package.json > tmp/package-ci.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tmp/package-ci.json

      - run: |
          case $PR_ACTION in
            all|refcache*|text)
              npm install --omit=optional
              ;&
            *)
              npm run fix:$PR_ACTION
              ;;
          esac
          git status
          git branch -v

      - name: Commit and push changes, if any
        run: |
          git config --local user.email "$USER_EMAIL"
          git config --local user.name "$USER_NAME"
          if [[ $(git status --porcelain) ]]; then
            git add -A
            current_branch=$(git rev-parse --abbrev-ref HEAD)
            echo current_branch=$current_branch
            # gh pr checkout sets some git configs that we can use to make sure
            # we push to the right repo & to the right branch
            remote_repo=$(git config --get branch.${current_branch}.remote)
            echo remote_repo=$remote_repo
            remote_branch=$(git config --get branch.${current_branch}.merge)
            echo remote_branch=$remote_branch
            git commit -m "Results from /fix:${PR_ACTION}"
            git push ${remote_repo} HEAD:${remote_branch}
          else
            echo "No changes to commit"
          fi
        env:
          GH_TOKEN: ${{ secrets.OPENTELEMETRYBOT_GITHUB_TOKEN }}

      - name: Report success and ask to run full checks
        if: ${{ !failure() && !cancelled() }}
        run: |
          gh pr comment $PR_NUM --body "$(cat <<EOF
          \`fix:${PR_ACTION}\` was [successful]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).
          ### IMPORTANT: (RE-)RUN \`/fix:all\` to ensure that there are no remaining check issues.
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.OPENTELEMETRYBOT_GITHUB_TOKEN }}

      - name: Report an error in the case of failure
        if: ${{ failure() || cancelled() }}
        run: |
          gh pr comment $PR_NUM -b "fix:${PR_ACTION} failed or was cancelled. For details, see $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
        env:
          GH_TOKEN: ${{ secrets.OPENTELEMETRYBOT_GITHUB_TOKEN }}

  nudge-action:
    name: Nudge PR workflows
    runs-on: ubuntu-latest
    # Comments need to be on their own lines in YAML
    # Only run when:
    # 1. It's a PR comment
    # 2. Comment starts with /nudge
    # 3. Comment is not from the bot
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/nudge') &&
      github.event.comment.user.login != 'opentelemetrybot'
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Context info
        run: |
          echo "PR Number: $PR_NUM"
          echo "Comment: $COMMENT"

      - uses: actions/checkout@v4

      - name: Write start comment
        run: |
          gh pr comment $PR_NUM -b "You triggered /nudge action to restart PR workflows at $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ secrets.OPENTELEMETRYBOT_GITHUB_TOKEN }}

      - name: Rerun failed workflows
        run: |
          # Get the PR's latest commit SHA
          SHA=$(gh pr view $PR_NUM --json headRefOid -q .headRefOid)
          echo "Latest commit SHA: $SHA"
          
          # Get failed workflow runs
          WORKFLOW_RUNS=$(gh run list --branch $(gh pr view $PR_NUM --json headRefName -q .headRefName) \
            --limit 20 \
            --json status,databaseId,name,conclusion \
            --jq '.[] | 
              select(.conclusion == "failure" or 
                     .conclusion == "cancelled" or 
                     .conclusion == "timed_out") | 
              {id: .databaseId, name: .name, conclusion: .conclusion}')

          if [ -z "$WORKFLOW_RUNS" ]; then
            echo "No failed workflows found to rerun"
            exit 0
          fi

          echo "Found failed workflow runs:"
          echo "$WORKFLOW_RUNS" | jq -r '. | "- \(.name) (ID: \(.id), Status: \(.conclusion))"'
          
          # Rerun workflows and verify
          echo "$WORKFLOW_RUNS" | jq -r .id | while read -r run_id; do
            echo "Attempting to rerun workflow ID: $run_id"
            
            # Use the REST API directly through gh api
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/rerun" \
              --silent || {
                echo "Failed to trigger rerun for workflow $run_id"
                continue
              }
            
            # Verify the rerun was triggered by checking new run exists
            sleep 5  # Give GitHub a moment to create the new run
            
            NEW_RUN=$(gh run list --limit 5 --json databaseId,name,status \
              --jq ".[] | select(.status == \"in_progress\" or .status == \"queued\")" | \
              grep -v "$GITHUB_RUN_ID")  # Exclude current workflow
            
            if [ -n "$NEW_RUN" ]; then
              echo "Successfully verified new run created for workflow $run_id:"
              echo "$NEW_RUN" | jq -r '.'
            else
              echo "WARNING: Could not verify new run for workflow $run_id"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.OPENTELEMETRYBOT_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Report status
        if: always()
        run: |
          gh pr comment $PR_NUM --body "$(cat <<EOF
          \`/nudge\` action completed.
          - Attempted to rerun failed, cancelled, or timed-out workflows
          - Please check the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) for details
          - If workflows didn't restart, you may need to manually rerun them or check repository permissions
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.OPENTELEMETRYBOT_GITHUB_TOKEN }}
